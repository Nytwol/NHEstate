<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual 3D Tour | GLOSS MATRIX</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        /* UI Overlay */
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px;
            z-index: 100;
            pointer-events: none;
        }
        
        .back-btn {
            display: inline-block;
            padding: 12px 25px;
            background: rgba(212, 175, 55, 0.9);
            color: #000;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 2px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            pointer-events: all;
        }
        
        .back-btn:hover {
            background: rgba(212, 175, 55, 1);
            transform: translateY(-2px);
        }
        
        .instructions {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: white;
            text-align: center;
            pointer-events: none;
            z-index: 100;
        }
        
        .instructions h3 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .instructions p {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #aaa;
        }
        
        .move-arrow {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.9);
            border: 3px solid #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: none;
            transform: translate(-50%, -50%);
            z-index: 50;
            cursor: pointer;
            transition: all 0.2s ease;
            pointer-events: auto;
        }
        
        .move-arrow:hover {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(212, 175, 55, 1);
        }
        
        .move-arrow::after {
            content: '↓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 32px;
            font-weight: bold;
        }
        
        .room-label {
            position: absolute;
            color: #d4af37;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            pointer-events: none;
            font-weight: 600;
        }
        
        
        .hidden {
            display: none;
        }
        
        /* MINIMAP */
        .minimap {
            position: fixed;
            top: 100px;
            right: 30px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(212, 175, 55, 0.5);
            border-radius: 8px;
            padding: 10px;
            z-index: 100;
        }
        
        .minimap h4 {
            color: #d4af37;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
            text-align: center;
        }
        
        .minimap-canvas {
            width: 100%;
            height: calc(100% - 30px);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            position: relative;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="ui-overlay">
        <a href="apartment-details.html" class="back-btn">← Back</a>
    </div>
    
    <div class="instructions">
        <h3>Controls</h3>
        <p>Click Floor - Move | Drag - Look Around | Scroll - Zoom</p>
    </div>
    
    <div class="minimap">
        <h4>Floor Plan</h4>
        <canvas class="minimap-canvas" id="minimapCanvas" width="180" height="160"></canvas>
    </div>
    
    <div class="move-arrow" id="moveArrow"></div>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.Fog(0x0a0a0a, 1, 50);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0); // Eye level height
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // Subtle Lighting with Soft Shadows
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 0.6);
        mainLight.position.set(10, 20, 10);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 50;
        mainLight.shadow.camera.left = -20;
        mainLight.shadow.camera.right = 20;
        mainLight.shadow.camera.top = 20;
        mainLight.shadow.camera.bottom = -20;
        mainLight.shadow.bias = -0.001;
        scene.add(mainLight);
        
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.25);
        fillLight.position.set(-10, 10, -10);
        scene.add(fillLight);
        
        const topLight = new THREE.PointLight(0xffffff, 0.3);
        topLight.position.set(0, 10, 0);
        scene.add(topLight);
        
        // Materials - White Room
        const wallMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xf5f5f5,
            metalness: 0.0,
            roughness: 0.9,
            aoMapIntensity: 1
        });
        
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffffff,
            metalness: 0.05,
            roughness: 0.8
        });
        
        const accentMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xe8e8e8,
            metalness: 0.3,
            roughness: 0.6
        });
        
        const edgeMaterial = new THREE.LineBasicMaterial({ 
            color: 0xcccccc,
            linewidth: 1
        });
        
        // Create wall function
        function createWall(width, height, depth, x, y, z, rotation = 0) {
            const wall = new THREE.Mesh(
                new THREE.BoxGeometry(width, height, depth),
                wallMaterial
            );
            wall.position.set(x, y, z);
            wall.rotation.y = rotation;
            wall.castShadow = true;
            wall.receiveShadow = true;
            
            // Add subtle edges
            const edges = new THREE.EdgesGeometry(wall.geometry);
            const line = new THREE.LineSegments(edges, edgeMaterial);
            wall.add(line);
            
            return wall;
        }
        
        // Create floor
        const floorSize = 40;
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(floorSize, floorSize),
            floorMaterial
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // Add subtle grid on floor
        const gridHelper = new THREE.GridHelper(floorSize, 40, 0xdddddd, 0xeeeeee);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);
        
        // Apartment Layout (3 bed, 3 bath, living, dining, kitchen, balcony)
        const wallHeight = 3;
        const wallThickness = 0.2;
        
        // Outer walls
        scene.add(createWall(20, wallHeight, wallThickness, 0, wallHeight/2, -10)); // North
        scene.add(createWall(20, wallHeight, wallThickness, 0, wallHeight/2, 10));  // South
        scene.add(createWall(wallThickness, wallHeight, 20, -10, wallHeight/2, 0)); // West
        scene.add(createWall(wallThickness, wallHeight, 20, 10, wallHeight/2, 0));  // East
        
        // Living Room (large space - front left)
        scene.add(createWall(8, wallHeight, wallThickness, -6, wallHeight/2, -3)); // Living north wall
        scene.add(createWall(wallThickness, wallHeight, 7, -10, wallHeight/2, -6.5)); // Living west partial
        
        // Dining Room (front center-right)
        scene.add(createWall(6, wallHeight, wallThickness, 3, wallHeight/2, -3)); // Dining north wall
        scene.add(createWall(wallThickness, wallHeight, 7, 0, wallHeight/2, -6.5)); // Dining divider
        
        // Kitchen (right side)
        scene.add(createWall(wallThickness, wallHeight, 6, 6, wallHeight/2, -4)); // Kitchen divider
        scene.add(createWall(4, wallHeight, wallThickness, 8, wallHeight/2, -1)); // Kitchen north
        
        // Master Bedroom (back left)
        scene.add(createWall(8, wallHeight, wallThickness, -6, wallHeight/2, 3)); // Master south wall
        scene.add(createWall(wallThickness, wallHeight, 7, -2, wallHeight/2, 6.5)); // Master divider
        
        // Master Bathroom (inside master bedroom)
        scene.add(createWall(3, wallHeight, wallThickness, -7.5, wallHeight/2, 5)); // Master bath wall
        scene.add(createWall(wallThickness, wallHeight, 3, -6, wallHeight/2, 6.5)); // Master bath side
        
        // Bedroom 2 (back center)
        scene.add(createWall(6, wallHeight, wallThickness, 2, wallHeight/2, 3)); // Bed2 south wall
        scene.add(createWall(wallThickness, wallHeight, 7, -2, wallHeight/2, 6.5)); // Bed2 west wall (shared)
        scene.add(createWall(wallThickness, wallHeight, 7, 5, wallHeight/2, 6.5)); // Bed2 east wall
        
        // Bedroom 3 (back right)
        scene.add(createWall(5, wallHeight, wallThickness, 7.5, wallHeight/2, 3)); // Bed3 south wall
        scene.add(createWall(wallThickness, wallHeight, 7, 5, wallHeight/2, 6.5)); // Bed3 west wall (shared)
        
        // Bathroom 2 (hallway)
        scene.add(createWall(3, wallHeight, wallThickness, -4.5, wallHeight/2, 0)); // Bath2 north
        scene.add(createWall(3, wallHeight, wallThickness, -4.5, wallHeight/2, -2)); // Bath2 south
        scene.add(createWall(wallThickness, wallHeight, 2, -6, wallHeight/2, -1)); // Bath2 west
        
        // Bathroom 3 (near bedroom 3)
        scene.add(createWall(3, wallHeight, wallThickness, 7.5, wallHeight/2, 0)); // Bath3 north
        scene.add(createWall(wallThickness, wallHeight, 3, 6, wallHeight/2, 1.5)); // Bath3 west
        
        // Balcony (extending from living room)
        scene.add(createWall(8, 1, wallThickness, -6, 0.5, -10.5)); // Balcony railing
        const balconyFloor = new THREE.Mesh(
            new THREE.PlaneGeometry(8, 2),
            floorMaterial
        );
        balconyFloor.rotation.x = -Math.PI / 2;
        balconyFloor.position.set(-6, 0.01, -11);
        scene.add(balconyFloor);
        
        // Add accent strips on walls
        for(let i = -10; i <= 10; i += 5) {
            const strip = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, 0.1, 20),
                accentMaterial
            );
            strip.position.set(i, 2.5, 0);
            scene.add(strip);
        }
        
        // Room labels (3D text sprites would be better, but using simple approach)
        const labels = [
            { text: 'LIVING ROOM', x: -6, z: -6.5 },
            { text: 'DINING', x: 3, z: -6.5 },
            { text: 'KITCHEN', x: 8, z: -4 },
            { text: 'MASTER BEDROOM', x: -6, z: 6.5 },
            { text: 'BEDROOM 2', x: 1.5, z: 6.5 },
            { text: 'BEDROOM 3', x: 7.5, z: 6.5 },
            { text: 'BALCONY', x: -6, z: -11 }
        ];
        
        labels.forEach(label => {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;
            context.fillStyle = '#d4af37';
            context.font = 'bold 48px Arial';
            context.textAlign = 'center';
            context.fillText(label.text, 256, 80);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.position.set(label.x, 2.5, label.z);
            sprite.scale.set(3, 0.75, 1);
            scene.add(sprite);
        });
        
        // Mouse/Touch controls for camera
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraRotation = { x: 0, y: 0 };
        
        // Target position for smooth movement
        let targetPosition = new THREE.Vector3(0, 1.6, 0);
        let currentPosition = new THREE.Vector3(0, 1.6, 0);
        let isMoving = false;
        
        // Raycaster for floor clicking
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const moveArrow = document.getElementById('moveArrow');
        let targetClickPosition = null;
        
        // Minimap setup with Orthographic Camera
        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');
        
        // Create orthographic camera for top-down view
        const minimapCamera = new THREE.OrthographicCamera(
            -12, 12,  // left, right
            12, -12,  // top, bottom (inverted for correct orientation)
            0.1, 100  // near, far
        );
        minimapCamera.position.set(0, 50, 0);
        minimapCamera.lookAt(0, 0, 0);
        minimapCamera.rotation.z = Math.PI; // Rotate to align with view
        
        // Create render target for minimap
        const minimapRenderTarget = new THREE.WebGLRenderTarget(
            minimapCanvas.width,
            minimapCanvas.height,
            {
                minFilter: THREE.LinearFilter,
                magFilter: THREE.NearestFilter,
                format: THREE.RGBAFormat
            }
        );
        
        // Read pixels buffer
        const pixelBuffer = new Uint8Array(
            minimapCanvas.width * minimapCanvas.height * 4
        );
        
        function drawMinimap() {
            // Render scene from top-down view to render target
            const originalClearAlpha = renderer.getClearAlpha();
            renderer.setClearAlpha(0.2);
            renderer.setRenderTarget(minimapRenderTarget);
            renderer.render(scene, minimapCamera);
            
            // Read pixels from render target
            renderer.readRenderTargetPixels(
                minimapRenderTarget,
                0, 0,
                minimapCanvas.width,
                minimapCanvas.height,
                pixelBuffer
            );
            
            // Reset to main camera
            renderer.setRenderTarget(null);
            renderer.setClearAlpha(originalClearAlpha);
            
            // Draw to canvas
            const imageData = minimapCtx.createImageData(
                minimapCanvas.width,
                minimapCanvas.height
            );
            
            // Flip Y coordinate (WebGL renders upside down)
            for (let y = 0; y < minimapCanvas.height; y++) {
                for (let x = 0; x < minimapCanvas.width; x++) {
                    const flippedY = minimapCanvas.height - y - 1;
                    const sourceIndex = (flippedY * minimapCanvas.width + x) * 4;
                    const targetIndex = (y * minimapCanvas.width + x) * 4;
                    
                    imageData.data[targetIndex] = pixelBuffer[sourceIndex];
                    imageData.data[targetIndex + 1] = pixelBuffer[sourceIndex + 1];
                    imageData.data[targetIndex + 2] = pixelBuffer[sourceIndex + 2];
                    imageData.data[targetIndex + 3] = 255;
                }
            }
            
            minimapCtx.putImageData(imageData, 0, 0);
            
            // Draw camera position indicator on top
            const width = minimapCanvas.width;
            const height = minimapCanvas.height;
            
            // Map camera position to minimap coordinates
            const camX = camera.position.x;
            const camZ = camera.position.z;
            
            // Convert world coordinates to minimap pixels
            const mapX = ((camX + 12) / 24) * width;
            const mapY = ((camZ + 12) / 24) * height;
            
            // Camera dot
            minimapCtx.fillStyle = '#ff0000';
            minimapCtx.beginPath();
            minimapCtx.arc(mapX, mapY, 5, 0, Math.PI * 2);
            minimapCtx.fill();
            
            // Camera direction indicator
            minimapCtx.strokeStyle = '#ff0000';
            minimapCtx.lineWidth = 3;
            minimapCtx.beginPath();
            minimapCtx.moveTo(mapX, mapY);
            const dirX = Math.sin(cameraRotation.y) * 12;
            const dirZ = Math.cos(cameraRotation.y) * 12;
            minimapCtx.lineTo(mapX + dirX, mapY + dirZ);
            minimapCtx.stroke();
            
            // Camera ring
            minimapCtx.strokeStyle = '#ffffff';
            minimapCtx.lineWidth = 2;
            minimapCtx.beginPath();
            minimapCtx.arc(mapX, mapY, 7, 0, Math.PI * 2);
            minimapCtx.stroke();
            
            // Camera label
            minimapCtx.fillStyle = '#fff';
            minimapCtx.font = 'bold 11px Arial';
            minimapCtx.textAlign = 'center';
            minimapCtx.strokeStyle = '#000';
            minimapCtx.lineWidth = 3;
            minimapCtx.strokeText('YOU', mapX, mapY - 15);
            minimapCtx.fillText('YOU', mapX, mapY - 15);
        }
        
        // Mouse down - start dragging to look around
        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });
        
        // Touch start
        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
        
        // Mouse move - rotate camera or show move indicator
        renderer.domElement.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                
                cameraRotation.y -= deltaX * 0.005;
                cameraRotation.x -= deltaY * 0.005;
                cameraRotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraRotation.x));
                
                previousMousePosition = { x: e.clientX, y: e.clientY };
            } else {
                // Show move arrow on floor hover
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(scene.children, true);
                
                let foundFloor = false;
                for (let intersect of intersects) {
                    if (intersect.object.geometry.type === 'PlaneGeometry') {
                        moveArrow.style.display = 'block';
                        moveArrow.style.left = e.clientX + 'px';
                        moveArrow.style.top = e.clientY + 'px';
                        targetClickPosition = intersect.point.clone();
                        foundFloor = true;
                        break;
                    }
                }
                if (!foundFloor) {
                    moveArrow.style.display = 'none';
                    targetClickPosition = null;
                }
            }
        });
        
        // Touch move
        renderer.domElement.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;
                
                cameraRotation.y -= deltaX * 0.005;
                cameraRotation.x -= deltaY * 0.005;
                cameraRotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraRotation.x));
                
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
        
        // Mouse up - stop dragging
        renderer.domElement.addEventListener('mouseup', (e) => {
            isDragging = false;
        });
        
        // Arrow click - move to position
        moveArrow.addEventListener('click', (e) => {
            e.stopPropagation();
            if (targetClickPosition) {
                targetPosition.copy(targetClickPosition);
                targetPosition.y = 1.6; // Keep at eye level
                
                // Boundary check
                targetPosition.x = Math.max(-9.5, Math.min(9.5, targetPosition.x));
                targetPosition.z = Math.max(-11.5, Math.min(9.5, targetPosition.z));
                
                isMoving = true;
                moveArrow.style.display = 'none';
            }
        });
        
        // Touch end
        renderer.domElement.addEventListener('touchend', (e) => {
            isDragging = false;
        });
        
        // Mouse wheel for zoom (optional)
        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.fov = Math.max(40, Math.min(90, camera.fov + e.deltaY * 0.05));
            camera.updateProjectionMatrix();
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Apply camera rotation
            camera.rotation.order = 'YXZ';
            camera.rotation.x = cameraRotation.x;
            camera.rotation.y = cameraRotation.y;
            
            // Smooth movement to target position
            if (isMoving) {
                currentPosition.lerp(targetPosition, 0.1);
                camera.position.copy(currentPosition);
                
                if (currentPosition.distanceTo(targetPosition) < 0.1) {
                    isMoving = false;
                }
            }
            
            // Update minimap
            drawMinimap();
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
